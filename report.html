<!DOCTYPE html>
<html lang="en">
<head>
	<link
 	  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	  rel="stylesheet"
	/>

	<link
	  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
	  rel="stylesheet"
	/>

	<link rel="stylesheet" href="styles.css" />
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Report an Issue</title>
</head>
<body>
	<header class="site-header">
		<a class="site-brand" href="index.html" aria-label="CrewComms home">
			<img class="site-logo" src="CrewCommsLogo.png" alt="CrewComms" >
		</a>
		<nav class="site-nav" aria-label="Main navigation">
			<a href="organizations.html">Organizations</a>
			<a href="dashboard.html">Dashboard (temp)</a>
			<a href="report.html">Report an Issue (temp)</a>
			<a href="index.html">Login</a>
		</nav>
	</header>
	
	<main class="container py-5">
		<section class="text-center mb-5">
			<h1 class="display-5 fw-bold">Report an Issue</h1>
			<p class="lead">
				Help this organization stay informed by reporting an issue.
			</p>
		</section>

		<section class="row justify-content-center">
			<div class="col-12 col-md-9 col-lg-7">
				<div class="card shadow-sm">
					<div class="card-body p-4 p-md-5">
						<h2 class="card-title text-center mb-4">
							Issue Details
						</h2>

						<form action="#" method="post" class="row g-3">
							<div class="col-12 col-md-6">
								<label for="name" class="form-label">
									Name <span class="text-muted">(optional)</span>
								</label>
								<input
									type="text"
									id="name"
									name="name"
									class="form-control"
								>
							</div>

							<div class="col-12 col-md-6">
								<label for="contact" class="form-label">
									Contact Info
									<span class="text-muted">(optional)</span>
								</label>
								<input
									type="text"
									id="contact"
									name="contact"
									class="form-control"
									placeholder="Phone or email"
								>
							</div>

							<div class="col-12">
								<label for="report-type" class="form-label">
									Report Type
								</label>
								<select
									id="report-type"
									name="report-type"
									class="form-select"
									required
								>
									<option value="">Select a report type</option>
									<option value="maintenance">
										Maintenance Report
									</option>
									<option value="complaint">
										Complaint
									</option>
								</select>
							</div>

							<fieldset class="col-12">
								<legend class="form-label fs-6">
									Reporter Type
								</legend>

								<div class="d-flex flex-wrap gap-3">
									<div class="form-check">
										<input
											class="form-check-input"
											type="radio"
											id="employee"
											name="reporter-type"
											value="employee"
											required
										>
										<label
											class="form-check-label"
											for="employee"
										>
											Employee
										</label>
									</div>

									<div class="form-check">
										<input
											class="form-check-input"
											type="radio"
											id="customer"
											name="reporter-type"
											value="customer"
										>
										<label
											class="form-check-label"
											for="customer"
										>
											Customer
										</label>
									</div>
								</div>
							</fieldset>

							<div class="col-12">
								<label for="description" class="form-label">
									Describe the issue
								</label>
								<textarea
									id="description"
									name="description"
									class="form-control"
									rows="6"
									required
								></textarea>
							</div>

							<div class="col-12">
								<button
									type="submit"
									class="btn btn-primary w-100"
								>
									Submit Report
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</section>
	</main>

	<footer class ="site-footer">
		<p>&copy; 2026 CrewComms</p>
		<p>Levi Draughon <a href="https://github.com/levidraughon13/startup/tree/main">GitHub</a></p>
	</footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
