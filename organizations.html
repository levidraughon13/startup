<!DOCTYPE html>
<html lang="en">
<head>
	<link
 	  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	  rel="stylesheet"
	/>

	<link
	  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
	  rel="stylesheet"
	/>

	<link rel="stylesheet" href="styles.css" />
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CrewComms</title>
</head>
<body>
	<header class="site-header">
		<a class="site-brand" href="index.html" aria-label="CrewComms home">
			<img class="site-logo" src="CrewCommsLogo.png" alt="CrewComms" >
		</a>
		<nav class="site-nav" aria-label="Main navigation">
			<a href="organizations.html">Organizations</a>
			<a href="dashboard.html">Dashboard (temp)</a>
			<a href="report.html">Report an Issue (temp)</a>
			<a href="index.html">Login</a>
		</nav>
	</header>

	<main class="container py-5">
		<section class="text-center mb-5">
			<h1 class="display-5 fw-bold">Organizations</h1>
			<p class="lead">
				Find and connect with your workplace or favorite business.
			</p>
		</section>

		<section
			aria-labelledby="organization-search-heading"
			class="mb-4"
		>


			<form class="row g-3">
				<div class="col-12 col-md-8">
					<label for="organization-search" class="form-label">
						Search Organizations
					</label>

					<input
						type="search"
						id="organization-search"
						name="organization-search"
						class="form-control"
						placeholder="Search organizations"
					>
				</div>

				<div class="col-12 col-md-4 d-flex align-items-end">
					<button type="submit" class="btn btn-primary w-100">
						Search
					</button>
				</div>
			</form>
		</section>

		<section aria-labelledby="organization-list-heading">
			<div class="card shadow-sm">
				<div class="card-body p-0">
					<div class="table-responsive">
						<table class="table table-striped table-hover align-middle mb-0">
							<caption
								id="organization-list-heading"
								class="caption-top px-4 pt-3"
							>
								Registered organizations
							</caption>

							<thead>
								<tr>
									<th scope="col">Organization Name</th>
									<th scope="col">Address</th>
									<th scope="col">Directions</th>
								</tr>
							</thead>

							<tbody>
								<tr>
									<td>Example Organization</td>
									<td>123 Main Street</td>
									<td>
										<a
											class="btn btn-primary btn-sm"
											href="https://www.google.com/maps/dir/?api=1&destination=123%20Main%20Street"
											target="_blank"
											rel="noopener noreferrer"
										>
											Get directions
										</a>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</section>
	</main>

	<footer class ="site-footer">
		<p>&copy; 2026 CrewComms</p>
		<p>Levi Draughon <a href="https://github.com/levidraughon13/startup/tree/main">GitHub</a></p>
	</footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
