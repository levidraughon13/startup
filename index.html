<!DOCTYPE html>
<html lang="en">
<head>
	<link
 	  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	  rel="stylesheet"
	/>

	<link
	  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
	  rel="stylesheet"
	/>

	<link rel="stylesheet" href="styles.css" />

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CrewComms</title>
</head>
<body>
	<header class="site-header">
		<a class="site-brand" href="index.html" aria-label="CrewComms home">
			<img class="site-logo" src="CrewCommsLogo.png" alt="CrewComms" >
		</a>
		<nav class="site-nav" aria-label="Main navigation">
			<a href="organizations.html">Organizations</a>
			<a href="dashboard.html">Dashboard (temp)</a>
			<a href="report.html">Report an Issue (temp)</a>
			<a href="index.html">Login</a>
		</nav>
	</header>

	<main class="container py-5">
		<section id="home" class="text-center py-5 mb-5">
			<h1 class="display-5 fw-bold">Welcome to CrewComms</h1>
			<p class="lead">
				The place to keep your team connected and informed.
			</p>
		</section>

		<section id="login" class="row justify-content-center">
			<div class="col-12 col-sm-10 col-md-7 col-lg-5">
				<div class="card shadow-sm">
					<div class="card-body p-4">
						<h2 class="card-title text-center mb-4">Login</h2>

						<form>
							<div class="mb-3">
								<label for="username" class="form-label">
									Username
								</label>
								<input
									type="text"
									id="username"
									name="username"
									class="form-control"
									placeholder="Username"
								>
							</div>

							<div class="mb-3">
								<label for="password" class="form-label">
									Password
								</label>
								<input
									type="password"
									id="password"
									name="password"
									class="form-control"
									placeholder="Password"
								>
							</div>

							<button type="submit" class="btn btn-primary w-100">
								Log In
							</button>
						</form>
					</div>
				</div>
			</div>
		</section>
	</main>

	<footer class ="site-footer">
		<p>&copy; 2026 CrewComms</p>
		<p>Levi Draughon <a href="https://github.com/levidraughon13/startup/tree/main">GitHub</a></p>
	</footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
