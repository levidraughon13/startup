<!DOCTYPE html>
<html lang="en">
<head>
	<link
 	  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	  rel="stylesheet"
	/>

	<link
	  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
	  rel="stylesheet"
	/>

	<link rel="stylesheet" href="styles.css" />
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CrewComms Dashboard</title>
</head>
<body>
	<header class="site-header">
		<a class="site-brand" href="index.html" aria-label="CrewComms home">
			<img class="site-logo" src="CrewCommsLogo.png" alt="CrewComms" >
		</a>
		<nav class="site-nav" aria-label="Main navigation">
			<a href="organizations.html">Organizations</a>
			<a href="dashboard.html">Dashboard (temp)</a>
			<a href="report.html">Report an Issue (temp)</a>
			<a href="index.html">Sign Out</a>
		</nav>
	</header>
    
	<main>
		<h1>Dashboard [Organization name]</h1>

		<section class="Announcements" aria-labelledby="announcements-title">
			<h4>Announcements</h4>
			<table>
                
				<thead>
					<tr>
						<th scope="col">Title</th>
						<th scope="col">Date</th>
						<th scope="col">Details</th>
						<th scope="col">Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td colspan="3">No announcements available.</td>
						<td><button type="button" disabled aria-label="Delete announcement">Delete</button></td>
					</tr>
				</tbody>
			</table>
		</section>

		<section class="Maintenance" aria-labelledby="maintenance-title">
			<h4>Maintenance Issues</h4>
			<table>
                
				<thead>
					<tr>
						<th scope="col">Issue</th>
						<th scope="col">Status</th>
						<th scope="col">Date</th>
						<th scope="col">Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td colspan="3">No maintenance issues available.</td>
						<td><button type="button" disabled aria-label="Delete maintenance issue">Delete</button></td>
					</tr>
				</tbody>
			</table>
		</section>
	</main>

	<footer class ="site-footer">
		<p>&copy; 2026 CrewComms</p>
		<p>Levi Draughon <a href="https://github.com/levidraughon13/startup/tree/main">GitHub</a></p>
	</footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
